<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
  <!-- 福利报销：新州州花瓦拉塔 ＋ 中国祥云。原创简笔画。 -->
  <defs>
    <path id="bract" d="M0 0 C-5 -6 -3 -18 4 -26 C6 -16 7 -6 0 0 Z"/>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#fbf3e2"/>
  <!-- 祥云 -->
  <path d="M22 38 H50 a6 6 0 1 0 -6 -6 a10 10 0 0 0 -19 -2 a6 6 0 1 0 -6 7" fill="none" stroke="#d8a64a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 94 H100 a5 5 0 1 0 -5 -5 a8 8 0 0 0 -15 -1 a5 5 0 1 0 -5 6" fill="none" stroke="#d8a64a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 茎和叶 -->
  <path d="M62 112 V74" stroke="#4f7a5d" stroke-width="3" stroke-linecap="round"/>
  <path d="M62 100 C52 96 42 98 34 104 C44 106 54 106 62 100 Z M62 90 C72 84 84 84 92 88 C82 94 72 94 62 90 Z" fill="#6f9a72"/>
  <!-- 苞片 -->
  <g fill="#b8402c">
    <use href="#bract" transform="translate(62 76) rotate(-70)"/>
    <use href="#bract" transform="translate(62 76) rotate(-40)"/>
    <use href="#bract" transform="translate(62 76) rotate(40) scale(-1 1)"/>
    <use href="#bract" transform="translate(62 76) rotate(70) scale(-1 1)"/>
  </g>
  <!-- 花头（一粒粒小花组成的圆顶） -->
  <path d="M42 72 C42 46 50 30 62 28 C74 30 82 46 82 72 Z" fill="#d65a3a"/>
  <g fill="#ee8f6c">
    <circle cx="54" cy="40" r="2.6"/><circle cx="62" cy="36" r="2.6"/><circle cx="70" cy="40" r="2.6"/>
    <circle cx="50" cy="50" r="2.6"/><circle cx="58" cy="47" r="2.6"/><circle cx="66" cy="47" r="2.6"/><circle cx="74" cy="50" r="2.6"/>
    <circle cx="48" cy="60" r="2.6"/><circle cx="56" cy="57" r="2.6"/><circle cx="64" cy="57" r="2.6"/><circle cx="72" cy="57" r="2.6"/><circle cx="77" cy="62" r="2.6"/>
    <circle cx="52" cy="67" r="2.6"/><circle cx="60" cy="66" r="2.6"/><circle cx="68" cy="66" r="2.6"/>
  </g>
</svg>
