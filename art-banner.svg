<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" aria-hidden="true">
  <!-- 顶部横幅：桂林山水、蓝花楹、江南月亮桥、悉尼渡轮、海港大桥、歌剧院、归雁、灯笼。原创简笔画。 -->
  <defs>
    <path id="cloud" d="M0 12 H44 M44 12 a6 6 0 1 0 -6 -6 a10 10 0 0 0 -19 -2 a6 6 0 1 0 -6 7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="sail"><path d="M0 0 Q3 -22 30 -38 Q21 -18 25 0 Z"/><path d="M8 0 Q10 -16 26 -30" fill="none" stroke-width=".9"/></g>
    <g id="lantern">
      <line x1="0" y1="-30" x2="0" y2="-13" stroke="#8a6a4a" stroke-width="1.2"/>
      <rect x="-5" y="-14" width="10" height="3" rx="1" fill="#d8a64a"/>
      <ellipse cx="0" cy="0" rx="10" ry="12" fill="#c9533a"/>
      <path d="M0 -12 V12 M-5 -10.5 Q-9 0 -5 10.5 M5 -10.5 Q9 0 5 10.5" fill="none" stroke="#e4a05a" stroke-width="1"/>
      <rect x="-5" y="11" width="10" height="3" rx="1" fill="#d8a64a"/>
      <path d="M0 14 V24" stroke="#c9533a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 太阳与祥云 -->
  <circle cx="156" cy="24" r="13" fill="#ecc06a" opacity=".85"/>
  <use href="#cloud" x="30" y="8" stroke="#d99a72" stroke-width="2.2"/>
  <use href="#cloud" x="806" y="6" stroke="#d99a72" stroke-width="2.2"/>

  <!-- 桂林山（远、近两层） -->
  <path d="M0 74 V54 C10 42 20 24 36 24 C52 24 54 50 64 56 C72 40 84 12 104 12 C124 12 126 46 136 52 C146 38 156 30 172 30 C188 30 192 58 204 62 C212 52 222 46 232 46 C248 46 254 66 266 74 Z" fill="#c7d9d1"/>
  <path d="M0 74 C14 74 18 48 34 48 C50 48 52 74 66 74 Z M82 74 C94 74 100 38 118 38 C136 38 138 74 152 74 Z M160 74 C170 74 176 56 188 56 C200 56 204 74 214 74 Z" fill="#a6c2b7"/>

  <!-- 归雁 -->
  <path d="M436 20 l5 3 l5 -3 M452 13 l4 2.5 l4 -2.5 M466 22 l4 2.5 l4 -2.5" fill="none" stroke="#6f857c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 蓝花楹 -->
  <path d="M238 74 C238 62 236 54 232 46 M236 58 C242 52 248 48 254 46 M234 52 C228 46 222 44 216 44" fill="none" stroke="#8a6a4a" stroke-width="2.2" stroke-linecap="round"/>
  <g fill="#9d87cb">
    <circle cx="216" cy="40" r="8"/><circle cx="228" cy="34" r="9"/><circle cx="242" cy="36" r="9"/><circle cx="255" cy="42" r="8"/><circle cx="234" cy="44" r="7"/>
  </g>
  <g fill="#bcaade"><circle cx="222" cy="36" r="4"/><circle cx="240" cy="31" r="4"/><circle cx="252" cy="38" r="3.5"/></g>

  <!-- 水面 -->
  <rect x="0" y="74" width="1000" height="16" fill="#dbe9ea"/>
  <path d="M40 82 q6 -3 12 0 t12 0 M150 85 q6 -3 12 0 t12 0 M520 84 q6 -3 12 0 t12 0 M610 81 q6 -3 12 0 t12 0 M920 84 q6 -3 12 0 t12 0" fill="none" stroke="#a5c4c9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 江南月亮桥（桥洞和倒影合成满月） -->
  <path d="M262 74 Q330 -4 398 74 Z M300 74 A30 30 0 0 1 360 74 Z" fill="#f4eee2" fill-rule="evenodd" stroke="#7f938a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M300 74 A30 30 0 0 0 360 74" fill="none" stroke="#a5c4c9" stroke-width="2"/>
  <path d="M280 58 L284 54 M296 44 L299 40 M330 37 V33 M364 44 L361 40 M380 58 L376 54" stroke="#7f938a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 悉尼渡轮 -->
  <path d="M428 74 L435 81 H485 L492 74 Z" fill="#2f6a4f"/>
  <rect x="440" y="65" width="40" height="9" rx="1.5" fill="#f1d891"/>
  <g fill="#2f6a4f"><rect x="444" y="67.5" width="5" height="3.5"/><rect x="452" y="67.5" width="5" height="3.5"/><rect x="460" y="67.5" width="5" height="3.5"/><rect x="468" y="67.5" width="5" height="3.5"/></g>
  <rect x="456" y="59" width="10" height="6" fill="#f1d891"/>

  <!-- 海港大桥 -->
  <rect x="506" y="50" width="18" height="24" fill="#d9c8a6"/><rect x="509" y="45" width="12" height="5" fill="#d9c8a6"/>
  <rect x="716" y="50" width="18" height="24" fill="#d9c8a6"/><rect x="719" y="45" width="12" height="5" fill="#d9c8a6"/>
  <path d="M524 74 Q620 -6 716 74 L708 74 Q620 10 532 74 Z" fill="#4b6b60"/>
  <path d="M548 61 L560 52 M566 49 L578 42 M590 37 L602 34 M638 34 L650 37 M662 42 L674 49 M680 52 L692 61" stroke="#9fb7ad" stroke-width="1.2"/>
  <line x1="500" y1="58" x2="740" y2="58" stroke="#4b6b60" stroke-width="3"/>
  <path d="M580 48.6 V58 M600 43.7 V58 M620 42 V58 M640 43.7 V58 M660 48.6 V58" stroke="#4b6b60" stroke-width="1.3"/>

  <!-- 歌剧院 -->
  <rect x="756" y="68" width="150" height="6" fill="#d9c8a6"/>
  <g fill="#f6f1e4" stroke="#7f958c" stroke-width="1.3" stroke-linejoin="round">
    <use href="#sail" transform="translate(766 68) scale(.62)"/>
    <use href="#sail" transform="translate(782 68) scale(.86)"/>
    <use href="#sail" transform="translate(804 68) scale(1.08)"/>
    <use href="#sail" transform="translate(838 68) scale(.8)"/>
    <use href="#sail" transform="translate(858 68) scale(1)"/>
    <use href="#sail" transform="translate(884 68) scale(.6)"/>
  </g>

  <!-- 灯笼 -->
  <use href="#lantern" x="950" y="34"/>
  <use href="#lantern" x="978" y="26"/>
</svg>
